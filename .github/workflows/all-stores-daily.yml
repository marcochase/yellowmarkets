name: All stores daily scrape

on:
  schedule:
    - cron: "0 3 * * *"  # ~05:00/06:00 Europe/Kiev depending on DST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python discount_scraper_all.py

      - name: Upload debug artifacts (only created on 0-match pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "discount-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all_stores_results.json
          git diff --quiet --cached || git commit -m "chore: daily all-stores scrape $(date -u +%Y-%m-%d)"
          git push
