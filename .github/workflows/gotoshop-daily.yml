name: GoToShop daily scrape

on:
  schedule:
    # 05:00 Europe/Kiev = 02:00 or 03:00 UTC depending on DST — adjust as needed
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the results file back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python gotoshop_scraper.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotoshop-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "gotoshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gotoshop_results.json
          git diff --quiet --cached || git commit -m "chore: daily gotoshop scrape $(date -u +%Y-%m-%d)"
          git push
